name: Pages

# Static distribution only: JSON per year plus index.html.
# The server bundle is NOT deployed here. GitHub Pages has no Node runtime,
# so anything needing the API belongs on the Worker, not on this workflow.

on:
  # Deploy hanya lewat tag yang berakhiran `-github`, contoh `v0.1.0-github`.
  # Awalan `-github` menandai channel distribusi: tag yang sama tanpa akhiran
  # tidak menyentuh Pages.
  #
  # `paths` sengaja tidak ada. Filter itu tidak dievaluasi untuk push tag, jadi
  # menulisnya cuma memberi kesan ada filtering padahal tidak. Tag sendiri
  # sudah jadi filter: hanya commit yang sudah deliberate yang ter-deploy.
  push:
    tags: ['*-github']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two deploys racing is the classic way to end up with a stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24, sama dengan yang dipakai lokal. Kalau CI dan lokal beda versi,
      # "lolos di CI" tidak berarti apa-apa buat siapa pun yang menjalankan
      # `npm run build` di mesin sendiri.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm ci`, bukan `npm install`: lockfile harus dipakai apa adanya, kalau
      # tidak dependensi bisa bergeser di antara build lokal dan build di sini.
      - run: npm ci

      # Typecheck dan test jalan sebelum build. Kartu yang gagal tidak perlu
      # sampai ke Pages dulu.
      - run: npm run typecheck
      - run: npm test

      # Base URL untuk canonical, og:url, dan contoh curl. `page_url` dari
      # `deploy-pages` tidak bisa dipakai di sini: output itu baru ada di job
      # `deploy`, sedangkan halaman ini digenerate di job `build` yang jalan
      # sebelumnya. Chicken-and-egg, jadi diambil dari REST API.
      #
      # `${{ github.repository }}` memakai repo yang SEDANG JALAN, jadi di fork
      # hasilnya `forkowner.github.io/forkrepo`, bukan milik upstream.
      #
      # Prioritas: `cname` kalau custom domain sudah verified, else `html_url`.
      # `html_url` dari API sudah berawalan `https://`, jadi tidak perlu tebak.
      - name: Tentukan base URL untuk halaman
        id: base
        run: |
          body=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo '')

          read -r cname state html_url <<EOF
          $(printf '%s' "$body" | node -e '
            let s = ""
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              try {
                const j = JSON.parse(s)
                console.log([j.cname || "-", j.protected_domain_state || "-", j.html_url || "-"].join(" "))
              } catch {
                console.log("- - -")
              }
            })
          ')
          EOF

          if [ -n "$cname" ] && [ "$cname" != "-" ] && [ "$state" = "verified" ]; then
            base="https://$cname"
            echo "memakai custom domain terverifikasi: $cname"
          elif [ -n "$html_url" ] && [ "$html_url" != "-" ]; then
            base="$html_url"
            echo "memakai html_url: $html_url"
            if [ -n "$cname" ] && [ "$cname" != "-" ]; then
              echo "::warning::cname $cname ada tapi belum verified, pakai html_url"
            fi
          else
            # Fork baru: Pages belum diaktifkan, jadi API balas 404. Halaman
            # tetap valid tanpa base URL - link navigasinya relatif dan blok
            # canonical dilewati.
            base=""
            echo "::warning::Pages API tidak mengembalikan URL (kemungkinan belum aktif). Halaman tetap di-deploy tanpa canonical."
          fi

          echo "base=${base%/}" >> "$GITHUB_OUTPUT"
          echo "Base URL halaman: \`${base:-tidak diketahui}\`" >> "$GITHUB_STEP_SUMMARY"

      - run: npm run build:static
      - run: npm run build:static-page
        env:
          PAGES_BASE_URL: ${{ steps.base.outputs.base }}

      # Guard: file JSON harus byte-identik dengan `data/`. Kalau `build-static`
      # pernah berubah bentuk sampai mengubah byte, step ini yang pertama mengetahuinya.
      - name: Pastikan JSON byte-identik dengan data/
        run: |
          for f in data/holidays-*.json; do
            base=$(basename "$f")
            if ! cmp -s "$f" "dist/$base"; then
              echo "::error file=$base::dist/$base berbeda dari $f"
              exit 1
            fi
          done
          echo "OK semua file JSON identik"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
